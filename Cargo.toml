[workspace]
resolver = "3"
members = [
    "crates/victory-core",
    "crates/victory-pe",
    "crates/victory-loader",
    "crates/victory-hle",
    "crates/victory-gpu",
    "crates/victory-shader",
    "crates/victory-formats",
    "crates/victory-pipeline",
    "crates/victory-game",
    "crates/xcl-core",
    "apps/xclvic",
    "xtask",
]
# Fixtures are standalone crates built on demand by integration tests; repos are reference clones.
exclude = ["tests/fixtures", "repos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
victory-core = { path = "crates/victory-core" }
victory-pe = { path = "crates/victory-pe" }
victory-loader = { path = "crates/victory-loader" }
victory-hle = { path = "crates/victory-hle" }
victory-gpu = { path = "crates/victory-gpu" }
victory-shader = { path = "crates/victory-shader" }
victory-formats = { path = "crates/victory-formats" }
victory-pipeline = { path = "crates/victory-pipeline" }
victory-game = { path = "crates/victory-game" }
xcl-core = { path = "crates/xcl-core" }

# External crates
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.2"
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "coff", "archive", "std"] }
windows-sys = "0.61.2"
windows = "0.62.2"
windows-core = "0.62.2"
blake3 = "1.8.7"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
walkdir = "2.5.1"
tempfile = "3.27.0"
# Opus decoding for the console's audio decoder (BSD-3-Clause, pure Rust).
opus-pure = "0.2.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"

[profile.diag]
inherits = "release"
